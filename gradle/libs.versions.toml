[versions]
#jetbrains
kotlin = "2.3.10"
#KSP
ksp = "2.3.7"
#Detekt
detekt = "1.23.8"
detektCompose = "0.4.28"
#AndroidX
androidx-lifecycle = "2.10.0"
androidx-print = "1.1.0"
androidx-constraintlayout = "2.2.1"
androidx-documentfile = "1.1.0"
androidx-activity-compose = "1.10.1"
androidx-navigation-compose = "2.9.7"
androidx-work = "2.10.1"
#Room
room = "2.8.4"
#Paging
paging = "3.3.6"
#Fossify
commons = "6.1.6"
#Gradle4
gradlePlugins-agp = "9.2.0"
gradlePlugins-baselineprofile = "1.5.0-alpha06"
#Baseline Profile
androidx-benchmark-macro = "1.4.1"
androidx-test-ext-junit = "1.3.0"
androidx-test-runner = "1.7.0"
androidx-test-uiautomator = "2.4.0"
androidx-espresso-core = "3.7.0"
#Other
androidImageCropper = "4.7.0"
jxlDecoder = "2.6.1"
media3Exoplayer = "1.10.0"
androidphotofilters = "193f2ae509"
subsamplingScaleImageView = "d705c3c4ad"
okhttp = "5.3.2"
okio = "3.17.0"
kotlinx-serialization-json = "1.7.3"
#Unit tests
junit = "4.13.2"
mockk = "1.13.13"
kotlinx-coroutines-test = "1.9.0"
#build
app-build-compileSDKVersion = "36"
app-build-targetSDK = "36"
app-build-minimumSDK = "26"
app-build-javaVersion = "VERSION_17"
app-build-kotlinJVMTarget = "17"
[libraries]
#AndroidX
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3Exoplayer" }
androidx-media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3Exoplayer" }
androidx-media3-ui-compose = { module = "androidx.media3:media3-ui-compose", version.ref = "media3Exoplayer" }
androidx-media3-transformer = { module = "androidx.media3:media3-transformer", version.ref = "media3Exoplayer" }
androidx-media3-effect = { module = "androidx.media3:media3-effect", version.ref = "media3Exoplayer" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "androidx-constraintlayout" }
androidx-print = { module = "androidx.print:print", version.ref = "androidx-print" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "androidx-documentfile" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "androidx-navigation-compose" }
#Room
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-paging = { module = "androidx.room:room-paging", version.ref = "room" }
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
#Paging
androidx-paging-runtime-ktx = { module = "androidx.paging:paging-runtime-ktx", version.ref = "paging" }
androidx-paging-compose = { module = "androidx.paging:paging-compose", version.ref = "paging" }
#Compose
compose-detekt = { module = "io.nlopez.compose.rules:detekt", version.ref = "detektCompose" }
#Fossify
fossify-commons = { module = "org.fossify:commons", version.ref = "commons" }
#Other
android-image-cropper = { module = "com.vanniktech:android-image-cropper", version.ref = "androidImageCropper" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
androidphotofilters = { module = "com.github.naveensingh:androidphotofilters", version.ref = "androidphotofilters" }
subsamplingscaleimageview = { module = "org.fossify:subsampling-scale-image-view", version.ref = "subsamplingScaleImageView" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
jxl-coder = { group = "io.github.awxkee", name = "jxl-coder", version.ref = "jxlDecoder" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization-json" }
work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "androidx-work" }
#Baseline Profile
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "androidx-benchmark-macro" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "androidx-test-uiautomator" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-espresso-core" }
#Unit tests
junit = { module = "junit:junit", version.ref = "junit" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines-test" }
[bundles]
room = [
    "androidx-room-ktx",
    "androidx-room-runtime",
    "androidx-room-paging",
]
[plugins]
android = { id = "com.android.application", version.ref = "gradlePlugins-agp" }
android-test = { id = "com.android.test", version.ref = "gradlePlugins-agp" }
baselineprofile = { id = "androidx.baselineprofile", version.ref = "gradlePlugins-baselineprofile" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
